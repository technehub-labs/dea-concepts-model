name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Semantic validation (CR-CM-001 §20)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pyyaml + jsonschema
        run: pip install pyyaml jsonschema
      - name: Run the Concepts Model validator
        run: python tools/validate.py
